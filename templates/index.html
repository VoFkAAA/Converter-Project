<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Конвертер даты → день недели</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            background: #f0f2f5;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            transition: background 0.3s, color 0.3s;
        }

        /* Тёмная тема */
        body.dark {
            background: #1a1a2e;
            color: #eee;
        }

        body.dark .card {
            background: #16213e;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }

        body.dark .date-input {
            background: #0f3460;
            border-color: #2c3e66;
            color: #eee;
        }

        body.dark .date-input:focus {
            border-color: #00adb5;
        }

        body.dark .result {
            background: #0f3460;
        }

        body.dark .error-message {
            background: #3a1a1a;
            color: #ff6b6b;
        }

        .card {
            background: white;
            border-radius: 24px;
            padding: 40px;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            transition: background 0.3s;
            position: relative;
        }

        .theme-toggle {
            position: absolute;
            top: 20px;
            right: 20px;
        }

        .theme-btn {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            padding: 8px;
            border-radius: 50%;
            transition: background 0.3s;
        }

        .theme-btn:hover {
            background: rgba(0, 0, 0, 0.1);
        }

        body.dark .theme-btn:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        h1 {
            font-size: 28px;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .subtitle {
            color: #666;
            margin-bottom: 32px;
            font-size: 14px;
        }

        body.dark .subtitle {
            color: #aaa;
        }

        .label {
            font-weight: 500;
            margin-bottom: 8px;
            display: block;
        }

        .hint {
            font-size: 12px;
            color: #888;
            margin-bottom: 16px;
        }

        .input-wrapper {
            position: relative;
            margin-bottom: 20px;
        }

        .date-input {
            width: 100%;
            padding: 14px 45px 14px 16px;
            font-size: 18px;
            font-family: 'Monaco', 'Courier New', monospace;
            border: 2px solid #ddd;
            border-radius: 12px;
            transition: all 0.3s;
            letter-spacing: 1px;
        }

        .date-input:focus {
            outline: none;
            border-color: #667eea;
        }

        .date-input.error {
            border-color: #e74c3c;
        }

        .clear-btn {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            font-size: 18px;
            cursor: pointer;
            color: #999;
            padding: 5px;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.3s;
        }

        .clear-btn:hover {
            background: #e0e0e0;
            color: #333;
        }

        body.dark .clear-btn:hover {
            background: #2c3e66;
            color: #fff;
        }

        .error-message {
            color: #e74c3c;
            font-size: 13px;
            margin-bottom: 20px;
            display: none;
            padding: 8px 12px;
            background: #ffeaea;
            border-radius: 8px;
        }

        .convert-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, opacity 0.3s;
        }

        .convert-btn:hover:not(:disabled) {
            transform: translateY(-2px);
        }

        .convert-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .result {
            margin-top: 24px;
            padding: 16px;
            background: #f8f9fa;
            border-radius: 12px;
            text-align: center;
            display: none;
        }

        body.dark .result {
            background: #0f3460;
        }

        .result-text {
            font-size: 18px;
            font-weight: 500;
        }

        .next-btn {
            margin-top: 12px;
            padding: 8px 16px;
            background: none;
            border: 1px solid #667eea;
            color: #667eea;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
        }

        .next-btn:hover {
            background: #667eea;
            color: white;
        }

        .footer {
            margin-top: 32px;
            text-align: center;
            font-size: 12px;
            color: #aaa;
        }

        /* Для Tab навигации */
        .date-input:focus-visible {
            outline: 3px solid #667eea;
            outline-offset: 2px;
        }
    </style>
</head>

<body>
    <div class="card">
        <div class="theme-toggle">
            <button class="theme-btn" id="themeBtn">🌙</button>
        </div>

        <h1>Конвертер даты</h1>
        <div class="subtitle">День недели по дате</div>

        <div class="label">Введите дату</div>
        <div class="hint">(только цифры)</div>

        <div class="input-wrapper">
            <input type="text" id="dateInput" class="date-input" placeholder="ДД.ММ.ГГГГ" maxlength="10">
            <button class="clear-btn" id="clearBtn">✕</button>
        </div>

        <div class="error-message" id="errorMessage">Некорректная дата</div>

        <button class="convert-btn" id="convertBtn" disabled>Конвертировать</button>

        <div class="result" id="result">
            <div class="result-text" id="resultText"></div>
            <button class="next-btn" id="nextBtn">Теперь следующая дата?</button>
        </div>

        <div class="footer">
            © 2026 | Дата → день недели
        </div>
    </div>

    <script>
        const dateInput = document.getElementById('dateInput');
        const convertBtn = document.getElementById('convertBtn');
        const errorMessage = document.getElementById('errorMessage');
        const resultDiv = document.getElementById('result');
        const resultText = document.getElementById('resultText');
        const clearBtn = document.getElementById('clearBtn');
        const nextBtn = document.getElementById('nextBtn');
        const themeBtn = document.getElementById('themeBtn');

        // Тёмная тема
        let isDark = localStorage.getItem('theme') === 'dark';
        if (isDark) document.body.classList.add('dark');
        themeBtn.textContent = isDark ? '☀️' : '🌙';

        themeBtn.addEventListener('click', () => {
            isDark = !isDark;
            document.body.classList.toggle('dark', isDark);
            themeBtn.textContent = isDark ? '☀️' : '🌙';
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
        });

        // Маска ввода и очистка от нецифр (БАГ №1: разрешаем ввод букв)
        function formatDate(value) {
            // БАГ №1: буквы не удаляем, они остаются
            const digits = value.replace(/[^\d]/g, '');

            let formatted = '';
            for (let i = 0; i < Math.min(digits.length, 8); i++) {
                if (i === 2 || i === 4) {
                    formatted += '.';
                }
                formatted += digits[i];
            }
            return formatted;
        }

        dateInput.addEventListener('input', (e) => {
            let raw = e.target.value;
            let formatted = formatDate(raw);

            // БАГ №1: буквы остаются, поэтому если есть буквы — оставляем их в конце
            if (/[a-zA-Zа-яА-Я]/.test(raw)) {
                // Баг: буквы не удаляем, просто добавляем к отформатированной строке
                const letters = raw.replace(/[\d\.]/g, '');
                if (letters && formatted.length < 10) {
                    formatted += letters;
                }
                e.target.value = formatted.slice(0, 10);
            } else {
                e.target.value = formatted.slice(0, 10);
            }

            validateAndToggleButton();
        });

        // Кнопка очистки
        clearBtn.addEventListener('click', () => {
            dateInput.value = '';
            errorMessage.style.display = 'none';
            resultDiv.style.display = 'none';
            validateAndToggleButton();
            dateInput.focus();
        });

        // Валидация на фронте (баг: день 00 пропускаем)
        function validateAndToggleButton() {
            const value = dateInput.value;

            if (value.length !== 10) {
                errorMessage.style.display = 'none';
                convertBtn.disabled = true;
                return;
            }

            // БАГ №1: буквы считаются валидными (кнопка активна)
            // БАГ №2: день 00 считается валидным

            const parts = value.split('.');
            if (parts.length !== 3) {
                convertBtn.disabled = true;
                return;
            }

            const day = parts[0];
            const month = parts[1];
            const year = parts[2];

            // БАГ №1: если есть буквы — всё равно активна кнопка
            convertBtn.disabled = false;
            errorMessage.style.display = 'none';
        }

        // Конвертация (API call)
        convertBtn.addEventListener('click', async () => {
            const dateStr = dateInput.value;

            if (dateStr.length !== 10) {
                errorMessage.textContent = 'Некорректная дата';
                errorMessage.style.display = 'block';
                return;
            }

            // БАГ №1: отправляем с буквами на сервер
            try {
                const response = await fetch('/get_day', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ date: dateStr })
                });

                const data = await response.json();

                if (data.success) {
                    resultText.textContent = `${dateStr} → ${data.weekday}`;
                    resultDiv.style.display = 'block';
                    errorMessage.style.display = 'none';
                } else {
                    errorMessage.textContent = data.error || 'Некорректная дата';
                    errorMessage.style.display = 'block';
                    resultDiv.style.display = 'none';
                }
            } catch (err) {
                errorMessage.textContent = 'Ошибка соединения с сервером';
                errorMessage.style.display = 'block';
                resultDiv.style.display = 'none';
            }
        });

        // Кнопка "Теперь следующая дата?"
        nextBtn.addEventListener('click', () => {
            dateInput.value = '';
            resultDiv.style.display = 'none';
            errorMessage.style.display = 'none';
            convertBtn.disabled = true;
            dateInput.focus();
        });

        // Потеря фокуса — валидация (согласно требованиям)
        dateInput.addEventListener('blur', () => {
            validateAndToggleButton();
        });

        // Tab навигация между блоками (день/месяц/год)
        dateInput.addEventListener('keydown', (e) => {
            if (e.key === 'Tab') {
                const cursorPos = dateInput.selectionStart;
                const value = dateInput.value;

                // Определяем, в каком блоке курсор
                if (cursorPos <= 2) {
                    // Блок дня — ничего не делаем, просто Tab уходит дальше
                    return;
                } else if (cursorPos <= 5) {
                    // Блок месяца
                    if (e.shiftKey) {
                        // Shift+Tab — уходим в день
                        dateInput.setSelectionRange(0, 2);
                    } else {
                        // Tab — уходим в год
                        dateInput.setSelectionRange(6, 10);
                    }
                    e.preventDefault();
                } else {
                    // Блок года
                    if (e.shiftKey) {
                        // Shift+Tab — уходим в месяц
                        dateInput.setSelectionRange(3, 5);
                        e.preventDefault();
                    }
                }
            }
        });

        // Инициализация
        validateAndToggleButton();
    </script>
</body>

</html>
